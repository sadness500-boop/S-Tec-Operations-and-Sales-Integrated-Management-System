# 윈도우 PC 프로그램(설치 파일 .exe)을 만들어 릴리스 「pc-latest」에 올립니다.
#   S-Tec-Operations-PC-Setup.exe          ← 앱 안 「📲 다운로드 › 💻 PC 프로그램」이 가리키는 고정 주소
#   S-Tec-Operations-PC-Setup_v{버전}.exe   ← 버전별 보관
# 프로그램은 GitHub Pages 의 최신 웹 화면을 불러오므로, 화면만 고칠 때는 다시 설치할 필요가 없습니다.
# 저장소에는 올리지 않습니다(설치 파일이 커서 저장소가 무거워짐).   Designed & Developed by Rat Rae Choi
name: Windows PC

on:
  push:
    branches: [main]
    paths: [version.json, desktop/**, icons/icon-512.png, .github/workflows/windows-pc.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-pc
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: 버전 넣기
        id: ver
        run: |
          V=$(node -p "require('../version.json').version")
          echo "v=$V" >> "$GITHUB_OUTPUT"
          npm pkg set version="$V"
          cp ../icons/icon-512.png build/icon.png
          echo "PC 프로그램 버전 $V"

      - name: 설치 파일 만들기
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          ok=0; for i in 1 2 3; do if npm install --no-audit --no-fund; then ok=1; break; fi; echo "npm install 재시도 $i"; sleep $((i*20)); done
          [ $ok = 1 ]
          npx electron-builder --win nsis --x64 --publish never
          V=${{ steps.ver.outputs.v }}
          ls -la dist
          cp "dist/S-Tec-Operations-PC-Setup_v$V.exe" dist/S-Tec-Operations-PC-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: S-Tec-Operations-PC-Setup_v${{ steps.ver.outputs.v }}
          path: desktop/dist/S-Tec-Operations-PC-Setup_v${{ steps.ver.outputs.v }}.exe

      - name: 최신판 릴리스 (pc-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-latest
          name: 에스텍 통합관리 — 윈도우 PC 프로그램 (최신)
          body: |
            윈도우 PC 설치 파일입니다. 현재 버전 v${{ steps.ver.outputs.v }}.
            1) S-Tec-Operations-PC-Setup.exe 를 내려받아 실행합니다.
            2) 「Windows의 PC 보호」 창이 나오면 「추가 정보 → 실행」을 누릅니다(회사 전용 프로그램이라 서명 인증서가 없어 나오는 안내입니다).
            3) 설치가 끝나면 바탕화면 「에스텍 통합관리」 아이콘으로 실행합니다.
            화면은 인터넷의 최신 버전을 불러오므로, 프로그램을 다시 설치할 일은 거의 없습니다.
          files: |
            desktop/dist/S-Tec-Operations-PC-Setup.exe
            desktop/dist/S-Tec-Operations-PC-Setup_v${{ steps.ver.outputs.v }}.exe
          make_latest: false
