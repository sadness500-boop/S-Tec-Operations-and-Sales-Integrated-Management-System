<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>사용자 매뉴얼 — 에스텍 운영 및 영업 통합관리 시스템</title>
<link rel="icon" href="icons/icon-192.png">
<!-- 사용자 매뉴얼 보기 (11개 프로그램 공통) — Designed & Developed by Rat Rae Choi -->
<style>
:root{--ink:#141a33;--mute:#5d6678;--nv:#0b1f8a;--gr:#1b7a34;--line:#dde2ef;--soft:#f5f7fb}
*{box-sizing:border-box}
body{margin:0;font-family:'Pretendard','Malgun Gothic','맑은 고딕',system-ui,sans-serif;color:var(--ink);background:#fff;line-height:1.65}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 18px;background:linear-gradient(90deg,#0b1757,#1530a0);color:#fff}
header img{width:34px;height:34px;border-radius:9px}
header b{font-size:16px;margin-right:auto}
header b small{display:block;font-weight:500;font-size:12px;opacity:.75}
header input{height:36px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;padding:0 14px;font:inherit;min-width:200px}
header input::placeholder{color:rgba(255,255,255,.7)}
header a,header button{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;font:inherit;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none}
body.embed header .dl{display:none}
.wrap{max-width:1180px;margin:0 auto;padding:18px;display:grid;grid-template-columns:250px 1fr;gap:22px}
nav{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 90px);overflow:auto;border:1px solid var(--line);border-radius:14px;padding:10px}
nav a{display:block;padding:7px 10px;border-radius:9px;color:var(--ink);text-decoration:none;font-size:14px}
nav a:hover{background:var(--soft)}
h1{margin:0 0 4px;font-size:26px}h1 small{font-size:14px;color:var(--mute);font-weight:500}
.sub{color:var(--mute);margin:0 0 16px}
section{border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:16px;scroll-margin-top:80px}
section h3{margin:0 0 10px;font-size:19px;display:flex;align-items:center;gap:10px}
section h3 .n{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--nv);color:#fff;font-size:14px}
.key{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}.key span{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;color:#34406a}
table{border-collapse:collapse;width:100%;margin:8px 0 12px;font-size:14px}
th{background:var(--nv);color:#fff;text-align:left;padding:8px 10px}
td{border-bottom:1px solid var(--line);padding:8px 10px;vertical-align:top}td:first-child{font-weight:700;color:var(--nv)}
.tip{background:#e8f6ec;border-radius:10px;padding:10px 14px;margin:8px 0}.warn{background:#fff4e5;border-radius:10px;padding:10px 14px;margin:8px 0}
mark{background:#ffe58a}
.sign{text-align:right;color:#8a1c34;font-style:italic;font-family:'Brush Script MT','Segoe Script',cursive;margin:20px 0}
@media (max-width:820px){.wrap{grid-template-columns:1fr}nav{position:static;max-height:none}header input{min-width:0;flex:1}}
@media print{header,nav{display:none}.wrap{display:block}section{break-inside:avoid}}
</style>
</head>
<body>
<header>
  <img src="icons/icon-192.png" alt="">
  <b>📘 사용자 매뉴얼<small>에스텍 운영 및 영업 통합관리 시스템 · 11개 프로그램 공통</small></b>
  <input id="q" type="search" placeholder="🔎 찾을 말 (예: 비밀번호)">
  <a class="dl" id="dW" target="_blank" rel="noopener">⬇️ Word</a>
  <a class="dl" id="dP" target="_blank" rel="noopener">⬇️ PPT</a>
  <button id="pr" type="button">🖨️ 인쇄</button>
</header>
<div class="wrap"><nav id="toc"></nav><main id="body"></main></div>
<script src="vendor/stec-guide.js"></script>
<script>
(function(){
  'use strict';
  const B = 'manuals/', NAME = '에스텍_통합관리시스템_사용자매뉴얼';
  const qs = new URLSearchParams(location.search);
  if(qs.get('embed')) document.body.classList.add('embed');
  const dW = document.getElementById('dW'), dP = document.getElementById('dP');
  dW.href = B + 'stec-user-manual.docx'; dW.download = NAME + '.docx';
  dP.href = B + 'stec-user-manual.pptx'; dP.download = NAME + '.pptx';
  document.getElementById('pr').onclick = () => window.print();
  const G = window.STEC_GUIDE, d = G && G.user;   /* 사용자 매뉴얼만 — 제작자 관리매뉴얼은 제작자 관리 콘솔에서 */
  const E = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let q = '';
  function hl(s){ const x = E(s); if(!q) return x; const re = new RegExp(E(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'); return x.replace(re, m => `<mark>${m}</mark>`); }
  const blk = b => b.p ? `<p>${hl(b.p)}</p>` : b.ul ? `<ul>${b.ul.map(i => `<li>${hl(i)}</li>`).join('')}</ul>` : b.ol ? `<ol>${b.ol.map(i => `<li>${hl(i)}</li>`).join('')}</ol>`
    : b.tip ? `<div class="tip">💡 ${hl(b.tip)}</div>` : b.warn ? `<div class="warn">⚠️ ${hl(b.warn)}</div>`
    : b.table ? `<div style="overflow-x:auto"><table><thead><tr>${b.table.head.map(h => `<th>${E(h)}</th>`).join('')}</tr></thead><tbody>${b.table.rows.map(r => `<tr>${r.map(c => `<td>${hl(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` : '';
  function render(){
    if(!d){ document.getElementById('body').innerHTML = '<p>매뉴얼을 불러오지 못했습니다. 인터넷 연결을 확인하세요.</p>'; return; }
    const l = q.toLowerCase(), secs = d.sections.map((s, i) => ({ s, i })).filter(({ s }) => !l || JSON.stringify(s).toLowerCase().includes(l));
    document.getElementById('toc').innerHTML = secs.map(({ s, i }) => `<a href="#s${i}">${i + 1}. ${E(s.h)}</a>`).join('') || '<span>찾은 내용 없음</span>';
    document.getElementById('body').innerHTML = `<h1>${E(d.title)} <small>${E(d.en)} · v${E(G.ver)}</small></h1><p class="sub">${E(d.sub)} · 대상: ${E(d.audience)}</p>` +
      secs.map(({ s, i }) => `<section id="s${i}"><h3><span class="n">${i + 1}</span>${hl(s.h)}</h3>${s.key ? `<div class="key">${s.key.map(k => `<span>${hl(k)}</span>`).join('')}</div>` : ''}${s.blocks.map(blk).join('')}</section>`).join('') +
      '<div class="sign">Designed &amp; Developed by Rat Rae Choi</div>';
  }
  let t; document.getElementById('q').oninput = e => { clearTimeout(t); t = setTimeout(() => { q = e.target.value.trim(); render(); }, 200); };
  render();
})();
</script>
</body>
</html>
